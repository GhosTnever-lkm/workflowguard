name: Release WorkflowGuard

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag {os.environ['RELEASE_TAG']} does not match project version {version}")
          PY
      - name: Build wheel and source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --disable-pip-version-check 'hatchling>=1.24,<2'
          mkdir -p dist
          python -m hatchling build -t wheel
          git archive --format=zip --prefix="WorkflowGuard-${RELEASE_TAG}/" HEAD -o "dist/WorkflowGuard-Source-${RELEASE_TAG}.zip"
          sha256sum dist/*.whl "dist/WorkflowGuard-Source-${RELEASE_TAG}.zip" > dist/SHA256SUMS.txt
      - name: Install wheel and smoke test the packaged CLI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m venv "$RUNNER_TEMP/workflowguard-release-venv"
          "$RUNNER_TEMP/workflowguard-release-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/workflowguard-release-venv/bin/workflowguard" --version | grep -Fx "workflowguard ${RELEASE_TAG#v}"
          "$RUNNER_TEMP/workflowguard-release-venv/bin/workflowguard" scan .github/workflows --format json --output "$RUNNER_TEMP/workflowguard-release-smoke.json" --fail-on never
      - name: Publish GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl "dist/WorkflowGuard-Source-${RELEASE_TAG}.zip" dist/SHA256SUMS.txt --verify-tag --title "WorkflowGuard ${RELEASE_TAG}" --generate-notes
